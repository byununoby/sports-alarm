name: update-schedule

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 5,11,17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 일정 수집 + 캘린더 생성
        run: python tracker.py

      - name: 변경분 커밋
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "일정 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      - name: 텔레그램 아침 알림
        if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
